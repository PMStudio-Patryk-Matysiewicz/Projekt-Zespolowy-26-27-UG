name: zerorisk

services:
  db:
    image: postgres:18-alpine
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      # 7-znakowy skrót commita, widoczny w GET /api/health. Wdrożenie ustawia go samo.
      GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
