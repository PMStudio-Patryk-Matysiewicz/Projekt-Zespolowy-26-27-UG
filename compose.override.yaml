# Ustawienia deweloperskie – `docker compose up` dokłada ten plik automatycznie.
# Hasła są tylko lokalne, więc mogą być w repo. Na VPS ten plik nie jest używany.

x-dev-db: &dev-db
  POSTGRES_DB: zerorisk
  POSTGRES_USER: zerorisk
  POSTGRES_PASSWORD: zerorisk

services:
  db:
    environment: *dev-db

  backend:
    environment:
      <<: *dev-db
      DJANGO_DEBUG: "1"
    command: python manage.py runserver 0.0.0.0:8000
    # Pliki tworzone w kontenerze (np. migracje) mają mieć właściciela jak na hoście.
    # Linux z uid innym niż 1000 albo rootless podman: patrz docs/docker.md.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./backend:/app:z
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # Serwer Vite z przeładowaniem po zapisie: http://localhost:5173.
  # /api, /admin i /static przekazuje do backendu (vite.config.ts, BACKEND_URL).
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_URL: http://backend:8000
      # Docker Desktop na Windowsie nie przekazuje do kontenera zdarzeń o zmianie plików.
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app:z
      # Osobne node_modules dla Linuksa w kontenerze; nie miesza się z Twojego z Windowsa.
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
