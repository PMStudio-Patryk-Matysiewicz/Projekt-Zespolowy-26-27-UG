# Produkcja (VPS). Sekrety i adresy są w .env (wzór: .env.prod.example).
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Jeśli .env zawiera COMPOSE_FILE, wystarczy: docker compose up -d --build

x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *prod
    env_file: .env

  backend:
    <<: *prod
    env_file: .env

  # nginx z zbudowanym Reactem: HTTPS (HTTP przekierowuje), strona i /api, /admin, /static do Django.
  frontend:
    <<: *prod
    build:
      context: ./frontend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      # Domena certyfikatu Let's Encrypt (certbot na hoście, docs/docker.md).
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
